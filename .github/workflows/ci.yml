name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Tesseract
        # pytesseract shells out to the tesseract binary. The unit tests stub
        # it, but installing it keeps the environment honest for anyone who
        # runs the OCR path in the logs.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify the lockfile is consistent
        run: |
          pip install pip-audit==2.9.0
          pip check

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy app

      - name: Pytest
        env:
          # A syntactically valid but non-functional key: the tests never call
          # the provider, they only need configuration to resolve.
          OPENAI_API_KEY: sk-test-not-a-real-key
        run: pytest --junitxml=pytest-report.xml --cov=app --cov-report=term-missing

      - name: Dependency audit
        run: pip-audit --requirement requirements.txt --strict

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: backend/pytest-report.xml
          if-no-files-found: ignore

  extension:
    name: Extension (lint, format)
    runs-on: ubuntu-latest
    # The extension lint toolchain lands in a later layer. Skip this job rather
    # than fail until then.
    if: ${{ hashFiles('frontend/extension/package.json') != '' }}
    defaults:
      run:
        working-directory: frontend/extension
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/extension/package.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Syntax check
        run: |
          node --check background.js
          node --check popup.js

  smoke:
    name: Backend boots and reports healthy
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Boot the app and check /api/health
        working-directory: backend
        env:
          OPENAI_API_KEY: sk-test-not-a-real-key
        run: |
          python - <<'PY'
          import app.main as main
          client = main.app.test_client()
          response = client.get("/api/health")
          assert response.status_code == 200, response.get_data(as_text=True)
          body = response.get_json()
          assert body["status"] == "ok", body
          print("health:", body)
          PY
