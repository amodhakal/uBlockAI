name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Tesseract
        # pytesseract shells out to the tesseract binary. The unit tests stub
        # it out, but installing it keeps the environment honest for anyone who
        # exercises the OCR path from the logs.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Dependency consistency
        run: pip check

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy app

      - name: Pytest
        env:
          # Syntactically valid but non-functional. The tests never reach the
          # provider, they only need configuration to resolve.
          OPENAI_API_KEY: sk-test-not-a-real-key
        run: pytest --junitxml=pytest-report.xml

      - name: Dependency audit
        run: |
          pip install pip-audit==2.9.0
          pip-audit --requirement requirements.txt --strict

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: backend/pytest-report.xml
          if-no-files-found: ignore

  extension:
    name: Extension (lint, format)
    runs-on: ubuntu-latest
    steps:
      # The extension lint toolchain lands in a later layer. Detect it here and
      # skip the remaining steps rather than failing.
      #
      # Note: hashFiles() is not permitted in a job-level `if`, which makes
      # GitHub reject the whole workflow before any job is scheduled. A step
      # that exports an output is used instead.
      - uses: actions/checkout@v4

      - name: Detect extension toolchain
        id: detect
        run: |
          if [ -f frontend/extension/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report
        run: |
          if [ "${{ steps.detect.outputs.present }}" != "true" ]; then
            echo "frontend/extension/package.json not present; skipping extension checks"
          fi

      - name: Set up Node
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/extension/package.json

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend/extension
        run: npm ci

      - name: ESLint
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend/extension
        run: npm run lint

      - name: Prettier check
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend/extension
        run: npm run format:check

      - name: Syntax check
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend/extension
        run: |
          node --check background.js
          node --check popup.js

  smoke:
    name: Backend boots and reports healthy
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Boot the app and check /api/health
        env:
          OPENAI_API_KEY: sk-test-not-a-real-key
        run: |
          python - <<'PY'
          import app.main as main

          client = main.app.test_client()
          response = client.get("/api/health")
          assert response.status_code == 200, response.get_data(as_text=True)
          body = response.get_json()
          assert body["status"] == "ok", body
          print("health:", body)
          PY
